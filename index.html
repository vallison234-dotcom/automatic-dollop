<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- AI Assistant Floating Widget -->
    <div id="ai-assistant-wrapper">
        <div id="ai-menu-panel">
            <div id="ai-menu-header">
                <div id="ai-menu-header-title">
                    🔮 Gemini AI <span class="ai-badge">API Live</span>
                </div>
                <div id="ai-close-btn" style="cursor:pointer; opacity:0.7; font-size: 18px;">×</div>
            </div>
            <div id="ai-chat-area">
                <div class="ai-msg ai-msg-bot">Connected to Gemini! Try a built-in command like "dark mode" or ask me anything!</div>
            </div>
            <div id="ai-input-area">
                <input type="text" id="ai-input" placeholder="Ask AI..." autocomplete="off" />
                <button id="ai-send-btn">➤</button>
            </div>
        </div>
        <div id="ai-floating-ball">🔮</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
